<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея-слайдер</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Галерея изображений</h1>
        
        <div class="gallery-container">
            <div class="gallery-slider">
                <div class="slide">
                    <img src="https://avatars.mds.yandex.net/i?id=1be62af853285f34e0c41016219d349053dfe3ac-10128543-images-thumbs&n=13" alt="Милый котик">
                </div>
                <div class="slide">
                    <img src="https://i.pinimg.com/1200x/a5/ed/76/a5ed76527c03323b16d34a04dd8b90dd.jpg" alt="Межгалактический бургер">
                </div>
                <div class="slide">
                    <img src="https://avatars.mds.yandex.net/i?id=791fa76ec5633822118c072d37d0ed771c7cf7d8-10966259-images-thumbs&n=13" alt="Иопсик">
                </div>
                <div class="slide">
                    <img src="https://i.pinimg.com/736x/a9/21/5a/a9215adf9680895e8c609ea27421f4b0.jpg" alt="Блаженный пес">
                </div>
                <div class="slide">
                    <img src="https://i.pinimg.com/1200x/84/0a/ae/840aae0dd2d1220543f26aeb38c4ed37.jpg" alt="Камера в холодильнике">
                </div>
                <div class="slide">
                    <img src="https://avatars.mds.yandex.net/i?id=defe876d34a11dd0ec5964c2f6918bf3_l-12520451-images-thumbs&n=13" alt="Опасная сова">
                </div>
                <div class="slide">
                    <img src="https://i.pinimg.com/originals/f6/f0/2a/f6f02ae97ec92ba25682dd2e9f0d89bc.jpg" alt="Китайский перекус">
                </div>
                <div class="slide">
                    <img src="https://i.pinimg.com/736x/6c/b7/b3/6cb7b3344636b753a0521ada1ca12af8.jpg" alt="Котик в майнкрафте">
                </div>
            </div>
            
            <div class="pager">
                <span>Страница:</span>
                <span class="current-page">1</span>
                <span>из</span>
                <span class="total-pages">8</span>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
